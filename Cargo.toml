[package]
name = "learning-lm-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
safetensors = "0.4.3"
tokenizers = "0.19.1"
rand = "0.8"
half = {version = "2.4.1", features = ["std","num-traits","serde"]}
num-traits = "0.2.19"
rayon = "1.8"
gemm = "0.17"
num-complex = "0.4" 
gguf = "0.1.2"
libc = "0.2"

[profile.dev]
incremental = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false

